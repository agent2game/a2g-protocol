# Security headers for agent2game.org (static docs site).
# Installed as /etc/nginx/snippets/agent2game-security.conf and included from the HTTPS server block.
# The page CSP (script/style hashes) is a <meta> tag generated by Astro; frame-ancestors only works as a header.

server_tokens off;
charset utf-8;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

# Never serve dotfiles (except ACME challenges).
location ~ /\.(?!well-known/) {
    deny all;
}
